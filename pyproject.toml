[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movere"
version = "0.1.0"
description = "Personal Project OS — daily AI coaching digest for your most important life projects"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.25.0",
    "garminconnect>=0.2.19",
    "google-api-python-client>=2.120.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "jinja2>=3.1.3",
    "tomli>=2.0.1; python_version < '3.11'",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
movere = "movere.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["movere*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
